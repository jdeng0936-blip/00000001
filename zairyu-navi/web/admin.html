<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<title>管理后台｜在留导航</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<main>
<h1>管理后台</h1>
<p class="muted">令牌只放在这个页面的内存里，关掉或刷新就要重新填。联系邮箱一律打码显示。这里没有修改类别、收费方式、登录番号和金额的功能：要改只能由服务商在“要求修改”后重新提交，再重新审核。</p>
<div class="card" id="login">
  <label for="adm-token">管理员令牌</label><input id="adm-token" type="password" autocomplete="off">
  <p><button type="button" id="adm-go">进入</button> <span id="adm-msg" role="status"></span></p>
</div>
<div id="app" hidden>
  <p><button type="button" id="tab-apps" aria-pressed="true">入驻申请</button> <button type="button" class="ghost" id="tab-providers" aria-pressed="false">服务商</button> <button type="button" class="ghost" id="tab-invoices" aria-pressed="false">账单</button>
    <button type="button" class="ghost" id="run-now">现在跑一轮</button> <span id="run-msg" role="status"></span></p>
  <section id="sec-apps">
    <label for="app-status" class="mw220">状态</label>
    <select id="app-status" class="mw220"><option value="pending">审核中</option><option value="changes_requested">需要修改</option><option value="approved">已批准</option><option value="rejected">未通过</option><option value="withdrawn">已撤回</option><option value="">全部</option></select>
    <div id="apps"></div>
  </section>
  <section id="sec-providers" hidden><div id="providers"></div></section>
  <section id="sec-invoices" hidden>
    <label for="inv-status" class="mw220">状态</label>
    <select id="inv-status" class="mw220"><option value="issued">待付款</option><option value="paid">已付款</option><option value="void">已作废</option><option value="">全部</option></select>
    <div id="invoices"></div>
  </section>
</div>
</main>
<script src="/admin.js"></script>
</body>
</html>
