<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>服务商工作台｜在留导航</title>
<link rel="stylesheet" href="/provider.css">
</head>
<body>
<main>
<h1>服务商工作台</h1>
<p class="muted">查看发给你的咨询并回复。你看到的只有咨询内容，看不到用户的账号信息。</p>
<div class="card" id="login">
  <label for="tok">工作台的令牌</label>
  <input id="tok" type="password" autocomplete="off">
  <p><button type="button" id="go">进入</button> <span id="msg" role="status"></span></p>
  <details id="claim-box"><summary>第一次使用或令牌丢了：用联系邮箱领取</summary>
    <p class="muted">填入驻申请时验证过的联系邮箱，收验证码后领取新令牌。领取后原来的令牌立即失效。我们不会用邮件发送令牌，也不会向你要令牌。</p>
    <label for="cl-email">联系邮箱</label><input id="cl-email" type="email" autocomplete="email">
    <p><button type="button" class="ghost" id="cl-send">发送验证码</button> <span id="cl-send-msg" role="status"></span></p>
    <label for="cl-code">邮件里的 6 位验证码</label><input id="cl-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <p><button type="button" id="cl-go">领取令牌</button> <span id="cl-msg" role="status"></span></p>
    <div id="cl-out" hidden><p class="draft">新令牌只显示这一次，请马上保存到密码管理器之类安全的地方：</p><p><code id="cl-token"></code></p><p><button type="button" id="cl-use">用这个令牌进入</button></p></div>
  </details>
  <p class="muted">还没有入驻？<a href="/provider-apply.html">服务商入驻申请</a>　<a href="/provider-terms.html">服务商条款</a></p>
</div>
<div id="me" hidden></div>
<div id="billing" hidden></div>
<h2 id="list-h" hidden>咨询</h2>
<p class="draft" id="list-msg" role="status" hidden></p>
<div id="list"></div>
</main>
<script src="/provider.js"></script>
</body>
</html>
