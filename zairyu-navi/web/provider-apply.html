<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>服务商入驻申请｜在留导航</title>
<link rel="stylesheet" href="/provider-apply.css">
</head>
<body>
<main>
<h1>服务商入驻申请</h1>
<p class="muted">面向在日本为外国人提供手续服务的士业事务所和事业者。审核时我们会对照所属会的公开检索核对登录番号。入驻后按固定的展示费收费（不按咨询数或成交数收费，士业不支付介绍费），详见<a href="/provider-terms.html" target="_blank" id="terms-link">服务商条款</a>。</p>

<div class="card" id="step1">
  <h2>第一步：验证联系邮箱</h2>
  <p class="muted">这个邮箱用来接收审核结果、领取工作台的令牌、账单和新咨询通知，不会公开。</p>
  <label for="ap-email">联系邮箱</label><input id="ap-email" type="email" autocomplete="email">
  <p><button type="button" id="ap-send">发送验证码</button> <span id="ap-send-msg" role="status"></span></p>
  <label for="ap-code">邮件里的 6 位验证码</label><input id="ap-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
</div>

<div class="card" id="form">
  <h2 id="form-h">第二步：填写申请</h2>
  <label for="ap-cat">服务类别</label><select id="ap-cat"></select>
  <label for="ap-name">事务所或公司名称</label><input id="ap-name" maxlength="80" autocomplete="organization">
  <label for="ap-address">事务所地址（会公开在名单上）</label><input id="ap-address" maxlength="200" autocomplete="street-address">
  <div id="lic-box">
    <label for="ap-lic" id="ap-lic-label">登录番号</label><input id="ap-lic" maxlength="40">
    <small id="ap-lic-hint"></small>
    <div id="body-box"><label for="ap-body" id="ap-body-label">所属会</label><input id="ap-body" maxlength="30"></div>
  </div>
  <label for="ap-fee">收费说明（例：首次咨询30分钟5,500日元；不能有夸大或承诺结果的用语）</label><textarea id="ap-fee" rows="2" maxlength="200"></textarea>
  <label for="ap-area">服务区域</label><input id="ap-area" maxlength="100">
  <label for="ap-langs">可以使用的语言</label><input id="ap-langs" maxlength="100">
  <p><label class="inl"><input type="checkbox" id="ap-agree">我已阅读并同意<a href="/provider-terms.html" target="_blank">服务商条款</a>（版本 <span id="ap-terms-v"></span>）</label></p>
  <p class="muted">请不要在任何一栏里写个人编号、护照号、银行账号这类号码，系统会拦下。</p>
  <p><button type="button" id="ap-submit">提交申请</button> <button type="button" class="ghost" id="ap-cancel-edit" hidden>取消修改</button> <span id="ap-msg" role="status"></span></p>
</div>
<p class="ok" id="ap-done" role="status" hidden></p>

<div class="card" id="view">
  <h2>查看或修改申请</h2>
  <p class="muted">用申请时的邮箱收验证码，查看审核进度；被要求修改时可以改后重新提交，审核完之前可以撤回。</p>
  <label for="vw-email">联系邮箱</label><input id="vw-email" type="email" autocomplete="email">
  <p><button type="button" class="ghost" id="vw-send">发送验证码</button> <span id="vw-send-msg" role="status"></span></p>
  <label for="vw-code">邮件里的 6 位验证码</label><input id="vw-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
  <p><button type="button" id="vw-open">查看</button> <span id="vw-msg" role="status"></span></p>
  <div id="vw-out"></div>
</div>
</main>
<script src="/provider-apply.js"></script>
</body>
</html>
